name: Generate Demo GIF

on:
  push:
    branches: [main]
    paths:
      - docs/demo.tape
      - scripts/demo-*.js

jobs:
  vhs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install VHS dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          # ttyd — VHS needs this to render the terminal
          wget -q "https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64" \
               -O /usr/local/bin/ttyd
          chmod +x /usr/local/bin/ttyd
          ttyd --version

      - name: Install VHS
        run: |
          VHS_TAG=$(curl -s https://api.github.com/repos/charmbracelet/vhs/releases/latest \
            | jq -r '.tag_name')
          VHS_VER=${VHS_TAG#v}
          curl -sL "https://github.com/charmbracelet/vhs/releases/download/${VHS_TAG}/vhs_${VHS_VER}_Linux_x86_64.tar.gz" \
            -o vhs.tar.gz
          tar xzf vhs.tar.gz vhs
          sudo mv vhs /usr/local/bin/vhs
          vhs --version

      - name: Generate demo GIF
        run: vhs docs/demo.tape

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: regenerate demo.gif"
          file_pattern: docs/demo.gif
