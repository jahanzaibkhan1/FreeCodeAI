name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Lint check
        run: npx --yes eslint src/ --ext .js --no-eslintrc --rule '{"no-unused-vars":"warn","no-undef":"error"}' || true

  docker:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t freecodeai .

      - name: Test Docker health
        run: |
          docker run -d --name test-freecodeai -p 3377:3377 freecodeai
          sleep 3
          curl -f http://localhost:3377/health || exit 1
          docker stop test-freecodeai
